# 一键部署：docker compose -f deploy/docker-compose.yml up -d --build
# 电脑关机后由任意常驻主机（VPS/NAS/云主机）维持 24/7 运转
services:
  autobiz-daemon:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    command: python run.py daemon --interval 3600
    volumes:
      - ../data:/app/data
      - ../docs:/app/docs
      - ../services:/app/services
    restart: unless-stopped

  autobiz-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    command: python run.py dashboard --port 8787
    ports:
      - "8787:8787"
    volumes:
      - ../data:/app/data
      - ../docs:/app/docs
    restart: unless-stopped
